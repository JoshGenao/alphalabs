# Integration + e2e workflow. THIS workflow has access to vendor API keys and
# the IB paper account. Secret hygiene is enforced by three layers:
#
#   1. Triggers — only `workflow_dispatch`, `push` to main, and `pull_request_target`
#      gated on the `safe-to-test` label being applied by a maintainer.
#   2. The `integration` Environment in GitHub requires reviewer approval before
#      jobs in this workflow can read its secrets.
#   3. Forked PRs cannot apply labels to themselves — only repo maintainers can.
#
# See plan §Cybersecurity step 1 for why we do NOT use `pull_request_target`
# without a label gate (it would expose secrets to fork-controlled code).

name: integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Authorize fork PR
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request_target' ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    outputs:
      ref: ${{ steps.set.outputs.ref }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: L5 + L6 (real I/O)
    needs: guard
    runs-on: ubuntu-latest
    environment: integration # forces "Required reviewers" gate before secrets unlock
    steps:
      - name: Checkout (PR head when label-gated)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # Every service in docker-compose.yml sits behind `profiles: ["phase1"]`, so a
      # bare `docker compose up -d` selects NOTHING and Compose exits 1 with "no
      # service selected" — which is why this job had never once got as far as running
      # a test. The profile is required, not optional.
      #
      # The SSD/NAS tiers are bind-mounted from ATP_SSD_DATA_DIR / ATP_NAS_DATA_DIR,
      # whose compose defaults (/var/lib/atp/{ssd,nas}) do not exist on a runner — and
      # note they disagree with init.sh, which defaults to <repo>/data/{ssd,nas}. Point
      # both at the workspace and create them, or the volume mount fails.
      # The tier paths are STEP-scoped on purpose — never `$GITHUB_ENV`, never job-level
      # `env:`. Both would leak them into the pytest steps, and the data CLIs resolve
      # their NAS tier as `--nas`, else $ATP_NAS_DATA_DIR, else <ssd>/nas
      # (data016_ingest_cli::resolve_nas). The integration tests pass only `--dir`, so a
      # job-wide value silently repoints every test's private tmp store at this SHARED,
      # container-mounted directory: DATA-012 then reads bars another test seeded
      # ("too many values to unpack") and DATA-017 collides with a foreign writer
      # ("another writer holds the market-data store lock"). Scope it to compose alone.
      - name: Bring up Docker Compose stack
        env:
          ATP_SSD_DATA_DIR: ${{ github.workspace }}/data/ssd
          ATP_NAS_DATA_DIR: ${{ github.workspace }}/data/nas
        run: |
          set -euo pipefail
          mkdir -p "$ATP_SSD_DATA_DIR" "$ATP_NAS_DATA_DIR"
          docker compose --profile phase1 up -d

      # FAIL CLOSED. The previous version polled http://localhost:3000/ — a port the
      # stack never publishes (3000 is ATP_DEV_PORT; the dashboard publishes 8080) —
      # and, because the loop had no failure branch, it simply ran out of iterations
      # and reported success over a stack that was never up. A readiness wait that
      # cannot fail is worse than no wait: it makes a dead stack look healthy.
      - name: Wait for the dashboard to serve
        env:
          # Only so the diagnostic `compose ps/logs` below resolve the volume config;
          # step-scoped for the same reason as the step above.
          ATP_SSD_DATA_DIR: ${{ github.workspace }}/data/ssd
          ATP_NAS_DATA_DIR: ${{ github.workspace }}/data/nas
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/dashboard >/dev/null 2>&1; then
              echo "dashboard is serving"
              exit 0
            fi
            sleep 2
          done
          echo "::error::dashboard never served on 127.0.0.1:8080 within 120s"
          docker compose --profile phase1 ps
          docker compose --profile phase1 logs --tail=50
          exit 1

      # NO brokerage credentials. `IB_PAPER_USERNAME` / `IB_PAPER_PASSWORD` used to be
      # injected here and were read by NOTHING — no Python, Rust or shell consumes them
      # — so they bought exfiltration surface for zero coverage. An IBKR paper login is
      # provisioned from the live account and commonly shares its password, so it is
      # live-grade material, not throwaway.
      #
      # The wire protocol IS covered here, without a broker: `srs_exe_006_ib_wire`
      # drives a deterministic in-process fake gateway on ephemeral loopback ports,
      # asserted byte-for-byte against golden vectors generated from the official
      # `ibapi` 10.19.4 client (run by `cargo test --workspace` in ci.yml). What needs a
      # REAL gateway stays operator-run behind ATP_RUN_INTEGRATION on the operator's own
      # machine — see the `live_broker` marker.
      - name: Run L5 integration tests
        env:
          ATP_RUN_INTEGRATION: "1"
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SHARADAR_API_KEY: ${{ secrets.SHARADAR_API_KEY }}
        # Deselect live-broker tests: `phase1-ib-gateway` is a `sleep 3600` placeholder,
        # so those operations can only ever fail with "Connection reset by peer" here.
        # Excluding them is not hiding a failure — it is declining to assert something
        # this environment structurally cannot exercise.
        run: pytest -m "integration and not live_broker" --junitxml=pytest-integration.xml

      - name: Run L6 e2e tests
        env:
          ATP_RUN_E2E: "1"
        run: pytest -m e2e --junitxml=pytest-e2e.xml

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose --profile phase1 down -v

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: integration-reports
          path: pytest-*.xml
          retention-days: 30
