# gitleaks configuration for alphalabs.
#
# This EXTENDS gitleaks' default ruleset (useDefault = true) so every real
# secret-detection rule stays active — it only ADDS a narrow allowlist for a
# vetted false positive. It does NOT replace or weaken the default rules.
#
# Defense-in-depth with tools/critic_check.py (check_secrets). Real credentials
# must never be committed; this file only silences a confirmed non-secret.

title = "alphalabs gitleaks config"

[extend]
useDefault = true

# --------------------------------------------------------------------------- #
# Vetted false positives (NOT real secrets)
# --------------------------------------------------------------------------- #
#
# gitleaks' generic-api-key rule matches the Python keyword argument
# `warmup_bars=canonical` inside
#   _build_reference_setup(api, warmup_bars=canonical)
# in tools/strategy_api_warmup_check.py: the `api` argument name followed by the
# `…=canonical` kwarg trips the keyword+assignment heuristic. The captured value
# is a function argument (Shannon entropy 3.73, well below a real key's ~4.5–6),
# not a credential. The regex is deliberately the exact benign substring so this
# allowlist cannot mask a real secret.
[[allowlists]]
description = "Python kwarg warmup_bars=canonical (function argument, not an API key)"
regexTarget = "match"
regexes = [
  '''warmup_bars=canonical''',
]

# gitleaks' generic-api-key rule also fires on PROSE COMMENTS that mention "API"
# followed by a quoted identifier. In docker-compose.yml the SRS-SEC-004 comment
#
#   # execution / live-control API. Members today: `phase1-jupyter` and the …
#
# yields Match = "API. Members today: `phase1-jupyter`" with the *service name*
# captured as the secret (entropy 3.52 — well under a real key's ~4.5–6).
#
# Only the full-history scan trips it, so the NIGHTLY `security` workflow failed on
# every scheduled run while every PR looked green (push/PR scans cover the diff
# only) — a permanently-red signal nobody could act on.
#
# Scoped to this project's compose service names, which are all `phase1-*` and can
# never be credentials; the sibling comments name several, so anchoring to just one
# would let the same false positive return under a different service. The anchors
# keep it from masking a real secret: no credential is a lowercase hyphenated
# `phase1-…` identifier.
[[allowlists]]
description = "Compose service names quoted in prose comments (phase1-*, not API keys)"
regexTarget = "secret"
regexes = [
  '''^phase1-[a-z0-9-]+$''',
]

# gitleaks' curl-auth-* rules fire on DOCUMENTED COMMAND RECIPES, where the
# credential position holds a placeholder the reader is meant to replace. Both
# live in git HISTORY, so editing the current tree cannot clear them — a
# full-history scan sees every commit that ever contained them. An allowlist is
# the only remedy short of rewriting history, which is not worth doing for a
# placeholder.
#
# This is why the NIGHTLY scan had never once succeeded: 20+ consecutive failures
# back to 2026-08-09, with zero successes, while every push stayed green (push
# scans cover the diff only). A guard that always fires is a guard everyone
# learns to ignore — CLAUDE.md rule 9 — and a real leaked credential would have
# landed in that report looking exactly like this noise.

# docs/DEPLOYMENT.md teaches `curl -sS -u operator:'<operator-password>' …` for
# polling ntfy. The captured "secret" is the literal angle-bracket placeholder.
#
# Scoped to the SHAPE rather than to this one string: a value whose credential
# half is `<…>` is a placeholder by construction, and no real credential is
# literally an angle-bracketed word. That also covers the next recipe someone
# documents, which anchoring on this exact line would not.
[[allowlists]]
description = "Angle-bracket placeholders in documented curl recipes (never real credentials)"
regexTarget = "secret"
regexes = [
  '''^[A-Za-z0-9_.@-]*:?'?<[A-Za-z][A-Za-z0-9 ._-]*>'?$''',
]

# The ntfy probe recipe deliberately sends an INVALID bearer token to prove the
# server answers 401 rather than accepting anything:
#   curl -v -H "Authorization: Bearer tk_definitely_invalid" …
#
# Scoped to `tk_` tokens whose value contains the word "invalid" and is otherwise
# only lowercase letters and underscores. A real ntfy token is `tk_` plus a
# high-entropy mixed-case alphanumeric run, so it cannot match this pattern.
[[allowlists]]
description = "ntfy probe tokens explicitly marked invalid (401-path fixtures, not credentials)"
regexTarget = "secret"
regexes = [
  '''^tk_[a-z_]*invalid[a-z_]*$''',
]
