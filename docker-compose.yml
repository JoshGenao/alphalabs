x-atp-env: &atp-env
  ATP_ENV: ${ATP_ENV:-development}
  ATP_IB_HOST: ${ATP_IB_HOST:-127.0.0.1}
  ATP_IB_LIVE_PORT: ${ATP_IB_LIVE_PORT:-4001}
  ATP_IB_PAPER_PORT: ${ATP_IB_PAPER_PORT:-4002}
  ATP_IB_ACCOUNT: ${ATP_IB_ACCOUNT:-placeholder-set-in-environment}
  ATP_MARKET_DATA_LINE_LIMIT: ${ATP_MARKET_DATA_LINE_LIMIT:-100}
  # SRS-SEC-001 encrypted credential vault (opt-in; empty in dev). In
  # staging/production, seal secrets in the vault and point these at the
  # read-only in-container paths (see the x-atp-secrets mount below).
  ATP_VAULT_FILE: ${ATP_VAULT_FILE:-}
  ATP_VAULT_KEY_FILE: ${ATP_VAULT_KEY_FILE:-}
  ATP_SSD_DATA_DIR: ${ATP_SSD_DATA_DIR:-/var/lib/atp/ssd}
  ATP_NAS_DATA_DIR: ${ATP_NAS_DATA_DIR:-/var/lib/atp/nas}
  ATP_SMTP_API_KEY: ${ATP_SMTP_API_KEY:-placeholder-set-in-environment}
  ATP_SMTP_SENDER: ${ATP_SMTP_SENDER:-atp-alerts@example.invalid}
  ATP_OPERATOR_EMAIL: ${ATP_OPERATOR_EMAIL:-operator@example.invalid}
  ATP_PUSH_HOST: ${ATP_PUSH_HOST:-127.0.0.1}
  ATP_PUSH_PORT: ${ATP_PUSH_PORT:-8090}
  ATP_PUSH_TOPIC: ${ATP_PUSH_TOPIC:-placeholder-set-in-environment}
  ATP_PUSH_TOKEN: ${ATP_PUSH_TOKEN:-placeholder-set-in-environment}
  DATABENTO_API_KEY: ${DATABENTO_API_KEY:-placeholder-set-in-environment}
  SHARADAR_API_KEY: ${SHARADAR_API_KEY:-placeholder-set-in-environment}
  ATP_LIVE_STRATEGY_MEM_MB: ${ATP_LIVE_STRATEGY_MEM_MB:-512}
  ATP_LIVE_STRATEGY_CPU: ${ATP_LIVE_STRATEGY_CPU:-0.25}
  ATP_PAPER_STRATEGY_MEM_MB: ${ATP_PAPER_STRATEGY_MEM_MB:-300}
  ATP_PAPER_STRATEGY_CPU: ${ATP_PAPER_STRATEGY_CPU:-0.10}
  ATP_HOST_MEMORY_SAFETY_MARGIN_MB: ${ATP_HOST_MEMORY_SAFETY_MARGIN_MB:-2048}

x-atp-volumes: &atp-volumes
  - atp_ssd:/ssd
  - atp_nas:/nas
  # SRS-SEC-001: the encrypted credential vault + key material, mounted
  # READ-ONLY from a host secrets directory into a stable in-container path.
  # ATP_VAULT_FILE / ATP_VAULT_KEY_FILE point at /run/atp-secrets/*. This
  # anchor is NOT applied to phase1-jupyter (own read-only data-only mounts),
  # so Jupyter cannot open the vault (SRS-SEC-004 credential isolation).
  - ${ATP_SECRETS_DIR:-./secrets}:/run/atp-secrets:ro

# SRS-SEC-001 / SRS-SEC-004 least-privilege: services that must NOT hold
# brokerage/notification credentials merge this OVER *atp-env to blank every
# catalogued secret + the vault key material, so even a plaintext .env cannot
# leak credentials into an isolated container (jupyter / IB Gateway / strategy
# runtime). Listed first in the `<<` sequence so these blanks win.
x-atp-no-secrets: &atp-no-secrets
  ATP_IB_ACCOUNT: ""
  ATP_SMTP_API_KEY: ""
  ATP_PUSH_TOPIC: ""
  ATP_PUSH_TOKEN: ""
  DATABENTO_API_KEY: ""
  SHARADAR_API_KEY: ""
  ATP_VAULT_FILE: ""
  ATP_VAULT_KEY_FILE: ""
  ATP_VAULT_PASSPHRASE: ""

services:
  # --- Architecture-check profile (SRS-ARCH-001 language boundary) ---
  orchestrator:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-orchestrator

  execution-engine:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-execution

  strategy-engine:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-strategy-engine

  simulation-engine:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-simulation

  market-data:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-market-data

  data-layer:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-data

  factor-pipeline:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-factor-pipeline

  notification-dispatcher:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-notification

  strategy-api:
    profiles: ["architecture-check"]
    build:
      context: .
      dockerfile: docker/strategy-python.Dockerfile

  # --- Phase 1 deployment stack (SRS-ARCH-004) ---
  # Brought up with: docker compose --env-file .env --profile phase1 up
  # Target: Proxmox-hosted Ubuntu VM (SyRS AC-13). Cloud VPS deployment
  # is a future target outside the release baseline; see
  # docs/DEPLOYMENT.md for portability constraints.

  phase1-orchestrator:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-orchestrator
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    volumes: *atp-volumes
    # SRS-ORCH-001: orchestrator is the sole component that manages
    # strategy container lifecycle.

  phase1-execution-engine:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-execution
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    volumes: *atp-volumes

  phase1-strategy-engine:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-strategy-engine
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    volumes: *atp-volumes

  phase1-simulation-engine:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-simulation
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    volumes: *atp-volumes

  phase1-market-data:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-market-data
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    volumes: *atp-volumes

  phase1-data-layer:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-data
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    volumes: *atp-volumes
    # SRS-DATA-008/009: SSD primary tier under /ssd, NAS archive under /nas.

  phase1-factor-pipeline:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-factor-pipeline
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    volumes: *atp-volumes

  phase1-notification-dispatcher:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/core-runtime.Dockerfile
      args:
        ATP_CRATE: atp-notification
    env_file:
      - path: .env
        required: false
    environment: *atp-env
    # SRS-SEC-001: SMTP/push credential consumer — needs the read-only vault mount.
    volumes: *atp-volumes

  # --- IF-10 email egress relay (SRS-NOTIF-001) ---
  #
  # WHY THIS EXISTS. The Rust workspace carries ZERO external crates, so a
  # std-only adapter has no TLS. Rather than break that invariant tree-wide, the
  # TLS boundary is a DEPLOYMENT component: `SmtpEmailChannel` speaks PLAINTEXT
  # SMTP to this relay over the compose network, and this relay owns the
  # authenticated TLS session to the real provider (Brevo / Gmail / ...).
  #
  # IN THE `notify` PROFILE, ALONGSIDE phase1-ntfy — not in `phase1`.
  #
  # An earlier version put it in `phase1`, reasoning that `REQUIRED_CHANNELS` is
  # fail-closed so the alert path needs this container. True, and still the wrong
  # profile: this service mounts an OPERATOR-SUPPLIED credential file that a
  # fresh checkout does not have, and Compose resolves a bind mount before the
  # container starts. `docker compose --profile phase1 up` therefore died on
  # `bind source path does not exist` for everyone without a provider account —
  # CI included, which is how it was found. Both alert endpoints need operator
  # credentials, and both are now brought up deliberately:
  #
  #   docker compose --env-file .env --profile phase1 --profile notify up -d
  #
  # `deployment_check.py` still enforces that this service EXISTS and is
  # registered in required_services; the profile governs when it starts, not
  # whether the deployment is complete without it.
  #
  # HOW ATP REACHES IT — and why this differs from ntfy. By SERVICE NAME, over
  # the compose network: `phase1-notification-egress:1025` is smtp.rs's
  # DEFAULT_RELAY_HOST/PORT. A name is acceptable here (where PushConfig refuses
  # one) because `EgressEndpoint` re-resolves and re-validates EVERY address on
  # EVERY connect, so the loopback/RFC 1918 guarantee is checked against what it
  # actually connects to rather than against a name resolved once at startup.
  #
  # ON THE DEFAULT NETWORK, not a dedicated single-member bridge like ntfy's.
  # ntfy can be isolated because ATP reaches it at the HOST's address; this relay
  # must be reachable by name from the alert producers AND needs outbound
  # internet to reach the provider. What keeps it safe is not network isolation
  # but mandatory AUTH: `smtpd_relay_restrictions = permit_sasl_authenticated,
  # reject` with NO permit_mynetworks, so a peer that can route here still
  # cannot forge an operator alert without ATP_SMTP_API_KEY.
  phase1-notification-egress:
    profiles: ["notify"]
    build:
      context: .
      dockerfile: docker/notification-egress.Dockerfile
    restart: unless-stopped
    # NO `env_file:`, unlike every ATP service above — and this is the whole
    # isolation, not a detail. `env_file` injects EVERY value in .env into the
    # container before the explicit `environment` below is applied, so the
    # least-privilege claim in that block would have been false: the IB account,
    # the data-vendor keys, the vault passphrase and the provider password would
    # all have been readable in this third-party MTA via `docker inspect`.
    # The `${...}` interpolation below reads from the COMPOSE PROJECT
    # environment (`docker compose --env-file .env ...`, which is what the
    # runbook prescribes), so the values still arrive — but only the named ones.
    # deployment_check refuses an env_file here, with a fixture.
    # EXPLICIT environment, NOT `*atp-env`. This is a Postfix container, not an
    # ATP process: it neither reads the ARCH-005 catalogue nor opens the vault,
    # so merging the full ATP environment would hand a third-party MTA every
    # catalogued secret — the IB account, the Databento and Sharadar keys, the
    # ntfy topic and token — for no reason. It gets exactly one catalogued
    # secret, ATP_SMTP_API_KEY, which is the password the adapter authenticates
    # with, plus the provider credentials below.
    environment:
      ATP_ENV: ${ATP_ENV:-development}
      ATP_SMTP_API_KEY: ${ATP_SMTP_API_KEY:-placeholder-set-in-environment}
      ATP_SMTP_SENDER: ${ATP_SMTP_SENDER:-atp-alerts@example.invalid}
      ATP_SMTP_RELAY_USER: ${ATP_SMTP_RELAY_USER:-}
      ATP_SMTP_RELAY_PORT: ${ATP_SMTP_RELAY_PORT:-1025}
      # The provider leg. DELIBERATELY NOT IN THE ARCH-005 CATALOGUE, for the
      # same reason as ATP_NTFY_UPSTREAM: every catalogue entry is a REQUIRED
      # key (python/atp_config/schema.py builds REQUIRED_KEYS from all of them),
      # and no ATP process reads these — only Postfix does. Cataloguing them
      # would make an unrelated service's readiness check fail on a variable it
      # never uses.
      ATP_EGRESS_PROVIDER_HOST: ${ATP_EGRESS_PROVIDER_HOST:-}
      ATP_EGRESS_PROVIDER_PORT: ${ATP_EGRESS_PROVIDER_PORT:-587}
      ATP_EGRESS_PROVIDER_USER: ${ATP_EGRESS_PROVIDER_USER:-}
      # NO ATP_EGRESS_PROVIDER_PASSWORD. There is no environment path for this
      # credential at all, in any ATP_ENV. An env var is readable by
      # `docker inspect` and inherited by every child process; the file below is
      # neither. The entrypoint refuses to start without the file.
      ATP_EGRESS_PROVIDER_PASSWORD_FILE: /run/egress-secrets/provider-password
    # NO `ports:` — PUBLISHING NOTHING TO THE HOST IS THE POINT. The submission
    # port is reachable only from peers on the compose network. Publishing it
    # would put an authenticated-relay endpoint on the host interface, and
    # `EgressEndpoint`'s private-address rule cannot help there: a host-published
    # port is still an RFC 1918 address.
    #
    # A SINGLE-FILE SECRET PROJECTION, not the vault. The relay must NOT mount
    # `*atp-volumes` or the whole `/run/atp-secrets` directory: it cannot read
    # the SRS-SEC-001 vault format, and either mount would hand a Postfix
    # container every sealed secret to protect the one it needs. What it gets is
    # exactly one file, read-only.
    #
    # THE FILE MUST EXIST BEFORE `up`, in every environment. An earlier version
    # promised a development fallback to ATP_EGRESS_PROVIDER_PASSWORD, which
    # could never have worked: Compose resolves a bind mount BEFORE the container
    # starts, so a missing source aborts the service and the entrypoint never
    # runs to read any fallback. Rather than paper that over with a
    # `create_host_path: true` that would silently mount an empty DIRECTORY
    # where a password file belongs, the fallback is gone and the requirement is
    # stated: create the file (docs/DEPLOYMENT.md), then bring the stack up.
    volumes:
      - type: bind
        source: ${ATP_EGRESS_PROVIDER_PASSWORD_FILE:-./secrets/notification-egress-provider-password}
        target: /run/egress-secrets/provider-password
        read_only: true
        bind:
          create_host_path: false

  # --- IF-11 push endpoint: self-hosted ntfy (SRS-NOTIF-001) ---
  #
  # DELIBERATELY NOT IN THE phase1 PROFILE. Two reasons:
  #   * the operator may already run ntfy elsewhere on the LAN, and forcing a
  #     second instance would split the topic/token state across two auth.db
  #     files;
  #   * bringing it up usefully means binding a LAN interface (see ATP_NTFY_BIND
  #     below), which should be a deliberate act, not a side effect of
  #     `--profile phase1`.
  # Start it with:
  #   docker compose --env-file .env --profile phase1 --profile notify up
  #
  # HOW ATP REACHES IT — read this before setting ATP_PUSH_HOST. Not by service
  # name: `PushConfig::new` refuses a hostname and requires a loopback/RFC 1918
  # IP LITERAL, because a name cannot be shown to stay private without resolving
  # it, and a resolution at startup does not bind what it resolves to at send
  # time. So ATP_PUSH_HOST is the HOST's LAN address — the same address the
  # operator's phone uses over the VPN. One address for both; no split-horizon
  # DNS to get wrong.
  #
  # This service takes NO ATP credentials. It is a third-party image, so it is
  # given an explicit NTFY_* environment instead of merging *atp-env — the ATP
  # secrets never enter it, which is why it needs neither the vault mount nor a
  # place in the x-atp-no-secrets blanking list.
  phase1-ntfy:
    profiles: ["notify"]
    # PINNED, not :latest. This is the only third-party image in the stack and it
    # sits on the alert path; with `restart: unless-stopped` a later
    # `docker compose pull` could otherwise swap the ntfy major version underneath
    # it. 2.27.0 is the version the transport's documented behaviours (the
    # inclusive 4,096-byte attachment threshold, the "triggered" empty-body
    # substitution, the 401/403 split) were actually reproduced against.
    image: binwiederhier/ntfy:v2.27.0
    # A fixed name so the runbook's `docker exec atp-ntfy ...` works on BOTH the
    # compose path and the bare-docker path. Compose would otherwise generate
    # `<project>-phase1-ntfy-1` and every token-creation command in the runbook
    # would fail with "No such container". Safe here: this service is a singleton
    # and is never scaled.
    container_name: atp-ntfy
    command: ["serve"]
    restart: unless-stopped
    ports:
      # SRS-SEC-002 / NFR-S3. BE PRECISE ABOUT WHAT IS AND IS NOT ENFORCED here,
      # because two earlier versions of this comment overclaimed it:
      #   * network_binding_check.py proves the DEFAULT below is loopback. Its
      #     own docstring says it is "NOT proof that an override is constrained".
      #   * ATP_NTFY_BIND carries `private_egress` in the ARCH-005 catalogue, so
      #     atp_config REJECTS a public / unspecified / link-local / non-literal
      #     value — but only when an ATP process validates configuration. It
      #     cannot unbind a socket, and `--profile notify up` starts no ATP
      #     process at all.
      #   * Nothing therefore PREVENTS `ATP_NTFY_BIND=0.0.0.0 docker compose up`
      #     from publishing this endpoint on every interface. The bind is done by
      #     the Docker daemon from an interpolated variable at `up` time; no
      #     build-time gate in this repo can reach it. That is the operator's
      #     responsibility, the same way external exposure of the dashboard is
      #     (SRS-SEC-002 / NFR-S3) — and it is why the default is loopback.
      # The DEFAULT is loopback, which the
      # operator's phone CANNOT reach — that is intentional (a stack brought up
      # without thinking must not publish an alert endpoint on the LAN). Set
      # ATP_NTFY_BIND to the host's RFC 1918 address to actually receive alerts.
      #
      # PORT 8090, NOT 8080: phase1-dashboard-api already publishes
      # 127.0.0.1:8080, so 8080 here makes the documented
      # `--profile phase1 --profile notify` bring-up die on "port is already
      # allocated" — and, worse, aims the default ATP_PUSH_PORT at the dashboard,
      # so an alert would POST its bearer token to the wrong service. 80 is
      # avoided because binding it is privileged on most hosts.
      - "${ATP_NTFY_BIND:-127.0.0.1}:${ATP_NTFY_PORT:-8090}:80"
    environment:
      NTFY_BASE_URL: http://${ATP_NTFY_BIND:-127.0.0.1}:${ATP_NTFY_PORT:-8090}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # iOS ONLY REACHES A LOCKED PHONE THROUGH THIS. The ntfy iOS app receives
      # notifications via Apple's APNs, and only ntfy.sh's own infrastructure can
      # send to APNs for that app — a self-hosted server cannot. Without an
      # upstream, an iPhone gets messages only while the app can hold a
      # connection, i.e. foreground. That is useless for StRS SN-1.12, whose
      # entire point is reaching an operator who is NOT looking.
      #
      # With it set, this server forwards a WAKE-UP to the upstream, which sends
      # the APNs push, and the phone then fetches the message from HERE. The alert
      # body never leaves the LAN; what the upstream learns is that an event fired
      # and when. That timing metadata is a real disclosure for a trading system,
      # which is why this is a knob and not a constant.
      #
      # It also puts a third party and an outbound-internet dependency back into
      # the alert path — and those failures CORRELATE with what SYS-46 reports: an
      # internet outage makes IB unreachable, strands the email relay, AND blocks
      # this wake-up, so the alert is dispatched and durably stored while the
      # operator hears nothing. See docs/DEPLOYMENT.md.
      #
      # Empty = disabled, VERIFIED against 2.27.0 (starts clean, no error). Leave
      # it empty for an Android target, which needs no upstream.
      #
      # NOTHING CONFIRMS THIS SETTING TOOK. Empty, valid and `not-a-url` all
      # produce byte-identical startup logs — a malformed upstream fails silently.
      # `docker exec atp-ntfy env | grep NTFY_UPSTREAM` proves the variable
      # arrived; only a locked-phone delivery proves it WORKS.
      NTFY_UPSTREAM_BASE_URL: ${ATP_NTFY_UPSTREAM:-}
      # LOAD-BEARING. Without deny-all, every topic on this instance is
      # world-publishable to anyone who can route to it — and on ntfy the topic
      # alone is enough to publish, so an unauthenticated instance lets anyone
      # who guesses or learns the topic forge an operator alert. ATP_PUSH_TOPIC
      # is catalogued `secret` for exactly this reason.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    volumes:
      # Persists auth.db (users, ACLs, tokens) and cache.db across restarts. On a
      # fresh volume the token is gone and every alert fails 401.
      - atp_ntfy:/var/lib/ntfy
    networks:
      # A DEDICATED, SINGLE-MEMBER bridge. Without this the service joins the
      # project's default network, which would give a LAN-exposed third-party
      # image a reachability path to phase1-dashboard-api — the kill-switch /
      # live-designation / Hot-Swap REST, published to loopback precisely to keep
      # it off the LAN — and to phase1-ib-gateway on 4001/4002. It needs neither:
      # by design ATP reaches ntfy at the HOST's RFC 1918 address, not over a
      # compose network, so nothing is lost by isolating it completely.
      - atp_notify_net

  phase1-dashboard-api:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/dashboard-api.Dockerfile
    env_file:
      - path: .env
        required: false
    # SRS-RES-001 deploy leg: actually SERVE the dashboard, so the same-origin
    # /research/ reverse proxy below is live rather than declarative. The image
    # CMD stays the compile-only stub (phase1-research-proxy shares this image
    # and overrides `command` the same way), so this is a per-service override.
    #
    # Why the bind host is resolved at start instead of taken from the env: a
    # process bound to the CONTAINER's loopback is unreachable through a
    # published port, so `ATP_DASHBOARD_BIND_HOST: 127.0.0.1` would serve
    # nothing to the operator's browser. `0.0.0.0` is refused outright by the
    # SRS-SEC-002 bind policy (`assert_bind_allowed` permits loopback and
    # RFC 1918 only). Docker assigns this container an RFC 1918 address, which
    # the policy DOES permit — so bind that, and let the loopback-only port
    # publish below be what confines exposure to the operator's host. The
    # `__main__` default stays 127.0.0.1 (pinned by network_binding_check).
    #
    # WHICH RFC 1918 address matters: this container is multi-homed (`default`
    # for the operator browser, `atp_research_edge_net` for the one-way hop to
    # the research proxy). `gethostbyname(gethostname())` picks whichever
    # /etc/hosts lists first — observed to be the research-edge address, where
    # the published port does NOT forward, so the dashboard came up healthy and
    # unreachable. The UDP-connect idiom below instead yields the source address
    # of the DEFAULT ROUTE, which is the operator-facing `default` network by
    # construction: `atp_research_edge_net` is `internal: true`, so Docker
    # attaches no gateway to it and it can never carry that route. No packet is
    # sent — a UDP connect only fixes the local endpoint.
    command:
      - sh
      - -c
      - >-
        export ATP_DASHBOARD_BIND_HOST="$$(python -c "import socket;
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM);
        s.connect(('10.255.255.255', 1));
        print(s.getsockname()[0])")";
        exec python -u -m atp_dashboard
    environment:
      <<: *atp-env
      # SRS-RES-001 / IF-13: the dashboard runtime reverse-proxies the
      # same-origin /research/ prefix to this FIXED upstream — the one-way
      # research-proxy hop below, NEVER phase1-jupyter directly (dashboard-api
      # must not join atp_research_net; jupyter_isolation_check enforces it).
      ATP_RESEARCH_UPSTREAM: http://phase1-research-proxy:8890
    # SRS-SEC-002: the dashboard is published to the operator's LOOPBACK only,
    # which is what keeps it off the LAN now that the in-container bind is the
    # container's own RFC 1918 address (see `command` above).
    ports:
      - "127.0.0.1:8080:8080"
    volumes: *atp-volumes
    # Declaring networks removes the implicit default-bridge membership, so
    # `default` must be EXPLICIT here (the operator browser + the other core
    # services reach dashboard-api through it — do not "simplify" it away).
    # atp_research_edge_net is the internal hop toward the research proxy;
    # dashboard-api is deliberately NOT on atp_research_net (SRS-SEC-004).
    networks:
      - default
      - atp_research_edge_net

  # SRS-RES-001 / SRS-SEC-004: the ONE-WAY dashboard->Jupyter hop. The only
  # member of BOTH atp_research_net (Jupyter's isolated internal network) and
  # atp_research_edge_net (the internal network dashboard-api reaches it on).
  # Its upstream is FIXED at phase1-jupyter (python/atp_research_proxy), so a
  # connection initiated FROM the Jupyter container can only loop back to
  # Jupyter itself — no forwarding path toward dashboard-api, the execution
  # engine, or the IB Gateway (it never joins the default bridge; enforced by
  # jupyter_isolation_check research-proxy assertions). Chain:
  #   browser -> 127.0.0.1:8080 dashboard-api -> (edge net) research-proxy
  #           -> (research net) phase1-jupyter
  # No secrets (blanked first), no volumes, no published ports.
  phase1-research-proxy:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/dashboard-api.Dockerfile
    command: ["python", "-m", "atp_research_proxy"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*atp-no-secrets, *atp-env]
      ATP_RESEARCH_PROXY_PORT: "8890"
      ATP_RESEARCH_UPSTREAM_HOST: phase1-jupyter
      ATP_RESEARCH_UPSTREAM_PORT: "8888"
    networks:
      - atp_research_net
      - atp_research_edge_net

  phase1-jupyter:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    env_file:
      - path: .env
        required: false
    # SRS-SEC-004: no brokerage/notification credentials — blanked via *atp-no-secrets.
    environment:
      <<: [*atp-no-secrets, *atp-env]
    # SRS-RES-001 + SRS-SEC-004: Jupyter has read-only access to data
    # mounts and is reachable through the dashboard, not directly.
    volumes:
      - atp_ssd:/ssd:ro
      - atp_nas:/nas:ro
    # SRS-SEC-004 (NFR-S6): NO direct access to the execution engine / IB Gateway
    # and NO ability to submit live orders. Jupyter is confined to the dedicated
    # `atp_research_net` network declared below with `internal: true`, so Docker
    # attaches no gateway — it has NO route to the host, the LAN, the internet, or
    # any other container. The execution engine and IB Gateway sit on the default
    # Compose bridge and are NOT on this network, so Jupyter can open no socket to
    # a brokerage / execution API. (Absence of `network_mode: host` alone is not
    # enough: a container with no explicit network joins the default bridge, which
    # both routes outbound through the host AND reaches every other default-bridge
    # container — the internal, single-member network removes both.) Jupyter reads
    # market data + backtest results from the read-only SSD/NAS mounts above
    # (filesystem, via the data layer — no network), so this isolation costs it no
    # functionality. The dashboard->Jupyter proxy (IF-13 / SRS-RES-001) is the
    # one-way phase1-research-proxy hop above: it joins this network to reach
    # Jupyter, while the live-control-bearing phase1-dashboard-api (SRS-API-001
    # kill switch / live designation / Hot-Swap) is NEVER placed on it, or
    # Jupyter would gain a path to the live-control REST. jupyter_isolation_check
    # enforces that dashboard-api, the execution engine, and the IB Gateway are
    # never on atp_research_net.
    networks:
      - atp_research_net
    # NO published ports (enforced statically): IF-13 — the research
    # environment is "not a standalone external endpoint"; it is reached ONLY
    # through the dashboard's same-origin /research/ proxy. (A publish here
    # would be dead anyway — internal:true networks attach no gateway.)

  phase1-ib-gateway:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/ib-gateway.Dockerfile
    env_file:
      - path: .env
        required: false
    # IB Gateway authenticates to IB out-of-band (its own credentials), so it
    # holds NO ATP brokerage/notification credentials and cannot open the vault:
    # all catalogued secrets + vault paths are blanked and no /run/atp-secrets
    # mount is granted (SRS-SEC-001 / SRS-SEC-004 least-privilege).
    environment:
      <<: [*atp-no-secrets, *atp-env]
    # SRS-EXE-006: headless IB Gateway. Replace this stub image with the
    # licensed IB Gateway container in production deployments.
    ports:
      - "${ATP_IB_HOST:-127.0.0.1}:${ATP_IB_LIVE_PORT:-4001}:${ATP_IB_LIVE_PORT:-4001}"
      - "${ATP_IB_HOST:-127.0.0.1}:${ATP_IB_PAPER_PORT:-4002}:${ATP_IB_PAPER_PORT:-4002}"

  phase1-strategy-runtime:
    profiles: ["phase1"]
    build:
      context: .
      dockerfile: docker/strategy-python.Dockerfile
    env_file:
      - path: .env
        required: false
    # SRS-SEC-004 least-privilege: strategy containers must not read brokerage
    # or notification credentials — all catalogued secrets + vault paths are
    # blanked and no /run/atp-secrets mount is granted, so a strategy cannot
    # read a credential or open the vault.
    environment:
      <<: [*atp-no-secrets, *atp-env]
    # SRS-SEC-003 least-privilege (NFR-S5 / CIS Docker Benchmark): strategy
    # containers run with NO privileged mode, NO host network access, and NO
    # access to other strategy containers' filesystems.
    #   - never privileged, and no new privileges can be gained at exec time;
    #   - every Linux capability dropped (nothing added back);
    #   - no host network access: never `network_mode: host`, and the strategy is
    #     confined to the dedicated `atp_strategy_net` network declared below with
    #     `internal: true`, so it has NO route to the host, the LAN, or the
    #     internet. The concrete StrategyContainerRuntime (deferred; owner
    #     SRS-ARCH-004 / SRS-ORCH-002) attaches the specific internal services a
    #     strategy may reach via the SYS-12 interface onto this network;
    #   - the shared SSD/NAS tiers are mounted READ-ONLY below, so a strategy
    #     cannot write into a tier another strategy could read.
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - atp_strategy_net
    # SyRS SYS-11 resource profiles. The orchestrator clones this template
    # for each strategy instance. Live profile: <=512 MB / <=0.25 CPU;
    # paper profile: <=300 MB / <=0.10 CPU.
    labels:
      atp.profile.live.memory: "512M"
      atp.profile.live.cpus: "0.25"
      atp.profile.paper.memory: "300M"
      atp.profile.paper.cpus: "0.10"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "512M"
    # SRS-SEC-004: data tiers only — the credential vault (/run/atp-secrets) is
    # deliberately NOT mounted here, so a strategy container cannot open it.
    # SRS-SEC-003: mounted READ-ONLY so a strategy cannot write into the shared
    # SSD/NAS tiers a sibling strategy could then read (filesystem isolation).
    volumes:
      - atp_ssd:/ssd:ro
      - atp_nas:/nas:ro

volumes:
  atp_ssd:
    # SRS-DATA-008 SSD primary tier; bind to ATP_SSD_DATA_DIR on the host.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ATP_SSD_DATA_DIR:-/var/lib/atp/ssd}
  atp_ntfy:
    # SRS-NOTIF-001 IF-11: the ntfy auth store (users, ACLs, access tokens) and
    # message cache. A plain named volume, NOT a bind mount into the ATP data
    # tiers — this is third-party service state, not trading data.
    driver: local
  atp_nas:
    # SRS-DATA-008/009 NAS archive tier; bind to ATP_NAS_DATA_DIR on the host.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ATP_NAS_DATA_DIR:-/var/lib/atp/nas}

networks:
  # SRS-SEC-003 (NFR-S5): strategy containers have NO host network access. This
  # dedicated bridge is `internal: true`, so Docker attaches no gateway to it —
  # a container confined to it can reach only other containers explicitly placed
  # on the same network, never the host, the LAN, or the internet. The concrete
  # StrategyContainerRuntime (deferred; owner SRS-ARCH-004 / SRS-ORCH-002) joins
  # the specific internal services a strategy may reach via SYS-12 onto it.
  atp_strategy_net:
    driver: bridge
    internal: true
  # SRS-SEC-004 (NFR-S6): the Jupyter research environment has NO direct access to
  # the execution engine and NO ability to submit live orders. This dedicated
  # bridge is `internal: true` — Docker attaches no gateway, so a container
  # confined to it reaches only other containers explicitly placed on it, never
  # the host, the LAN, or the internet. Only `phase1-jupyter` is on it today — the
  # execution engine, the IB Gateway, and the live-control-bearing dashboard/API
  # (SRS-API-001) are NOT — so Jupyter can open no socket to a brokerage /
  # execution / live-control API. Members today: `phase1-jupyter` and the
  # one-way `phase1-research-proxy` hop (IF-13 / SRS-RES-001) — NEVER
  # `phase1-dashboard-api`; jupyter_isolation_check enforces that dashboard-api,
  # the execution engine, and the IB Gateway are never on it (and that the
  # research proxy never shares a network with the execution peers).
  atp_research_net:
    driver: bridge
    internal: true
  # SRS-RES-001: the internal edge hop between the dashboard/API and the
  # research proxy. `internal: true` — no gateway; members are exactly
  # phase1-dashboard-api and phase1-research-proxy. Keeping this as a SEPARATE
  # network (rather than putting dashboard-api on atp_research_net) is what
  # preserves the SRS-SEC-004 one-way boundary: Jupyter's only reachable peer
  # is the fixed-upstream proxy, never the live-control REST.
  atp_research_edge_net:
    driver: bridge
    internal: true
  # SRS-NOTIF-001 IF-11: the single-member bridge phase1-ntfy sits on, so a
  # third-party image published to the LAN shares no network with the execution
  # peers (see the service's own comment).
  #
  # NOT `internal: true`, unlike the three above, and the difference is load
  # bearing. Those confine containers that must reach nothing; ntfy exists to be
  # reached. Verified rather than assumed: a container on an `internal` network
  # is unreachable through its published port (`docker run --network <internal>
  # -p 127.0.0.1:PORT:80` → connection refused from the host), so marking this
  # one internal would silently break every operator alert while looking like a
  # tightening. The isolation here comes from being the network's ONLY member.
  atp_notify_net:
    driver: bridge
